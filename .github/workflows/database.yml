name: database

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Keep applied D1 migrations unchanged
        if: github.event_name == 'pull_request'
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed=$(git diff --name-only --diff-filter=DMRT "$MIGRATION_BASE" HEAD -- d1/migrations)
          if [ -n "$changed" ]; then
            echo "Applied D1 migrations must stay unchanged. Add a new numbered migration instead:"
            echo "$changed"
            exit 1
          fi
      - name: Check the D1 schema
        run: node --test tests/d1-schema.test.mjs
      - name: Apply every D1 migration to a fresh local database
        run: npx wrangler d1 migrations apply DB --env production --local --persist-to "$RUNNER_TEMP/d1"
