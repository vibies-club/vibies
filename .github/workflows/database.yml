name: database

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  migration-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Test migration guards
        run: node --test tests/migrations.test.mjs tests/migration-scope.test.mjs
      - name: Check snapshots and migration history
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npm run check:migrations -- --base "$MIGRATION_BASE"
      - name: Classify migration proof
        id: migration-scope
        env:
          MIGRATION_BASE: ${{ github.event.pull_request.base.sha }}
          MIGRATION_HEAD: ${{ github.event.pull_request.head.sha }}
        run: node scripts/migration-scope.mjs
      - uses: supabase/setup-cli@v1
        if: steps.migration-scope.outputs.full == 'true'
        with:
          version: 2.109.1
      - name: Start the disposable local database
        id: database-start
        if: steps.migration-scope.outputs.full == 'true'
        run: supabase db start
      - name: Prove the full migration chain
        if: steps.migration-scope.outputs.full == 'true'
        run: npm run check:database-migrations
      - name: Remove the disposable local database
        if: always() && (steps.database-start.outcome == 'success' || steps.database-start.outcome == 'failure')
        run: supabase stop --no-backup
