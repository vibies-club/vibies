name: app

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  app-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Check D1 schema and security suites
        run: npm run test:d1
      - name: Check static Worker HTTP boundary
        run: npm run test:worker
      - name: Build Cloudflare Worker
        run: npm run build:cloudflare
