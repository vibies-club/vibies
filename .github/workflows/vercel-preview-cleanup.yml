name: Vercel Preview cleanup

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Already merged pull request number
        required: true
        type: string
      apply:
        description: Delete the verified settings
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  pull-requests: read

jobs:
  cleanup:
    if: >-
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.base.ref == 'main' &&
       github.event.pull_request.base.repo.full_name == github.repository &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.head.ref != 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: preview-cleanup
    concurrency:
      group: vercel-preview-cleanup-${{ github.event.pull_request.number || inputs.pr_number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          repository: vibies-club/vibies
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Clean merged branch Preview settings
        env:
          CLEANUP_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
          CLEANUP_APPLY: ${{ github.event_name == 'pull_request_target' || inputs.apply }}
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_CLEANUP_TOKEN: ${{ secrets.VERCEL_CLEANUP_TOKEN }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_TEAM_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: |
          if [ "$CLEANUP_APPLY" = "true" ]; then
            node scripts/cleanup-vercel-preview.mjs \
              --repository vibies-club/vibies \
              --pr "$CLEANUP_PR_NUMBER" \
              --project "$VERCEL_PROJECT_ID" \
              --team "$VERCEL_TEAM_ID" \
              --apply
          else
            node scripts/cleanup-vercel-preview.mjs \
              --repository vibies-club/vibies \
              --pr "$CLEANUP_PR_NUMBER" \
              --project "$VERCEL_PROJECT_ID" \
              --team "$VERCEL_TEAM_ID"
          fi
